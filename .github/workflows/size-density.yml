name: Size density

# Evidence, not a gate: renders the app text sizes on each platform's own
# rasterizer and reports any size step that suddenly looks heavier.
on:
  pull_request:
    paths:
      - 'fonts/*.otf'
      - 'verify_size_density.py'
      - '.github/workflows/size-density.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, browser: chromium, label: windows-chromium}
          - {os: windows-latest, browser: chromium, channel: msedge, label: windows-edge}
          - {os: windows-latest, browser: chromium, grayscale: true, label: windows-chromium-grayscale}
          - {os: windows-latest, browser: chromium, channel: msedge, grayscale: true, label: windows-edge-grayscale}
          - {os: macos-latest, browser: webkit, label: macos-webkit}
          - {os: ubuntu-latest, browser: chromium, label: linux-chromium}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install measurement tools
        run: pip install 'fonttools[woff]==4.66.1' 'playwright==1.63.0' 'brotli==1.2.0' pillow numpy
      - name: Install the bundled browser
        if: ${{ !matrix.channel }}
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Measure 15 / 17.2 / 18.5 / 20 / 22px at 100%, 125%, 150% and 200% scale
        shell: bash
        run: |
          mkdir -p dist
          python verify_size_density.py dist/size-density --browser ${{ matrix.browser }} --dpr 1 1.25 1.5 2 ${{ matrix.channel && format('--channel {0}', matrix.channel) || '' }} ${{ matrix.grayscale && '--grayscale' || '' }} | tee dist/size-density-summary.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: size-density-${{ matrix.label }}
          path: dist/
